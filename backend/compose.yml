services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bookwise
      POSTGRES_USER: bookwise
      POSTGRES_PASSWORD: bookwise_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://bookwise:bookwise_password@postgres:5432/bookwise
    depends_on:
      - postgres

volumes:
  postgres_data:
